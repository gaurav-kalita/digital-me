name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATA_DIR: ../data
          INDEX_ARTIFACT_PATH: ../data/.index/chunks.json
          FAISS_INDEX_PATH: ../data/.index/chunks.faiss
          FAISS_METADATA_PATH: ../data/.index/chunks.metadata.json
          REDIS_CACHE_ENABLED: "false"
          EMBEDDER_TYPE: hashing
          EMBEDDING_DIMENSIONS: "32"
          GUARDRAIL_ENABLED: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
